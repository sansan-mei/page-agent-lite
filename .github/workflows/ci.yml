name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test-only dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check runtime JavaScript syntax
        run: |
          for file in extension/*.js; do node --check "$file"; done
      - name: Run simulated DOM and Chrome API tests
        run: npm test
