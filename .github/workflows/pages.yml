name: Landing page
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'extension/icons/**'
      - 'docs/assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy shared images into the site
        run: |
          mkdir -p site/assets
          cp extension/icons/icon-48.png extension/icons/icon-128.png extension/icons/welcome-assistant.webp docs/assets/sidepanel-preview.png site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
