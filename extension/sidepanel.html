<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page Agent Lite</title><link rel="icon" href="icons/icon-32.png"><link rel="stylesheet" href="ui-theme.css"><link rel="stylesheet" href="sidepanel.css"><script defer src="sidepanel.js"></script><script defer src="welcome-image.js"></script></head>
<body>
<header class="app-header"><button id="history" type="button" aria-controls="history-view" aria-expanded="false"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2.6 7M3 4v7h7M12 7v5l3 2"/></svg>历史记录</button><button id="finish" type="button" title="结束当前任务并输入新目标">新对话</button><button id="settings" type="button" title="设置与记忆管理">设置</button></header>
<div class="site-bar"><p id="target">正在连接当前标签页…</p><button id="grant" type="button" hidden disabled>授权当前网站</button><button id="grant-all" type="button" hidden disabled>授权全部网页</button></div>
<p id="status" role="status" aria-live="polite"></p>
<main id="conversation" aria-label="当前任务对话">
<div id="empty-state"><img class="welcome-art" src="icons/welcome-assistant.png" width="240" height="240" alt="" aria-hidden="true"><h2>这页交给我吧</h2><p>读内容、填表单，从一句话开始。</p></div>
<section id="task" hidden aria-label="你的目标"><p id="goal"></p></section>
<div id="timeline" role="log" aria-label="任务消息" aria-live="polite"></div>
<section id="important-notice" hidden role="status" aria-live="polite"></section>
<details id="task-plan" hidden><summary>任务计划（历史进度）</summary><p>已核对仅代表记录时的页面状态；最终结果需重新验证。</p><ol id="task-plan-items"></ol></details><form id="choice-form" hidden><fieldset><legend id="choice-question"></legend><div id="choice-options"></div></fieldset><button id="choice-submit" type="submit">提交选择并继续</button></form>
<section id="confirmation" hidden><h2>请确认操作</h2><p id="operation"></p><button id="approve" type="button">确认并继续</button></section>

</main><aside id="history-view" hidden aria-label="历史记录"><div class="history-heading"><h2>历史记录</h2><button id="history-back" type="button">返回对话</button></div><p class="history-note">当前标签页、当前网站的对话；仅在本次浏览器会话内保留</p><div id="conversation-list"></div><p id="history-goal"></p><div id="history-messages"></div><p id="history-empty">暂无历史记录</p><details id="run-details" hidden><summary>运行详情 <span id="record-count"></span></summary><p id="task-meta"></p><p id="metrics"></p><p id="context-usage"></p>
<section id="verification" hidden><h2>操作核对</h2><p id="waiting"></p><div id="evidence"></div></section>
<details id="context-panel" hidden><summary>当前任务摘要</summary><p id="context-meta"></p><div id="context-summary"></div></details>
<div id="results"></div><details id="event-panel"><summary>完整状态记录</summary><div id="event-log"></div></details></details><button id="clear" type="button">清空当前对话记录</button></aside>
<footer id="composer" class="composer"><div class="activity"><p id="progress" role="status" aria-live="polite"></p><button id="resume" type="button" hidden>继续任务</button></div><form id="chat"><label for="instruction" class="sr-only">输入任务或补充指令</label><textarea id="instruction" maxlength="2000" rows="2" required placeholder="告诉我你想做什么…"></textarea><div class="composer-actions"><div><button id="takeover" type="button" hidden>我来操作</button><button id="stop" type="button" hidden>停止</button><button id="start" type="submit" title="发送任务">发送</button></div></div></form><p class="composer-note" title="Enter 发送，Shift + Enter 换行">内容发送至自选模型 · 关闭侧栏后任务仍可运行</p></footer>
</body></html>
