<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-i18n="optTitle">Page Agent Lite · 设置</title><link rel="icon" href="icons/icon-32.png"><link rel="stylesheet" href="ui-theme.css"><link rel="stylesheet" href="options.css"><script defer src="i18n.js"></script><script defer src="core.js"></script><script defer src="script-tools.js"></script><script defer src="options.js"></script><script defer src="script-settings.js"></script><script defer src="management.js"></script><script defer src="welcome-image.js"></script><script src="global-management.js" defer></script></head>
<body><main>
<header class="settings-header"><img src="icons/logo.webp" alt="" width="40" height="40"><div><h1>Page Agent Lite</h1><p data-i18n="optIntro">连接你自己的模型，就能在侧栏开始使用。</p></div></header>
<form id="config">
<section id="connection" class="card"><h2 data-i18n="optConnectionTitle">连接模型</h2>
<div class="field"><label for="apiFormat" data-i18n="optApiFormat">接口格式</label><select id="apiFormat"><option value="openai" selected data-i18n="optApiFormatOpenai">OpenAI 兼容（Chat Completions）</option><option value="anthropic" data-i18n="optApiFormatAnthropic">Claude（Anthropic Messages）</option></select></div>
<div class="field"><label for="endpoint" data-i18n="optEndpoint">API 地址</label><input id="endpoint" type="url" required placeholder="https://api.openai.com/v1" autocomplete="off" aria-describedby="connection-hint"></div>
<div class="field-row">
<div class="field"><label for="model" data-i18n="optModel">模型</label><input id="model" required maxlength="120" placeholder="填写服务商提供的模型 ID" data-i18n-placeholder="optModelPlaceholder"></div>
<div class="field"><label for="key" data-i18n="optKey">API 密钥</label><input id="key" type="password" maxlength="4096" autocomplete="off" spellcheck="false" placeholder="本机服务可留空" data-i18n-placeholder="optKeyPlaceholder"></div>
</div>
<p id="connection-hint" class="hint" data-i18n="optConnectionHint">地址填到 /v1，不含 /chat/completions；密钥只存本机。</p>
<div class="save-row"><button id="save-settings" class="primary" type="submit" data-i18n="optSave">保存</button><p id="status" role="status" aria-live="polite" hidden></p></div>
</section>
<section id="scripts" class="card script-row"><div class="script-text"><div class="script-title"><h2 data-i18n="optScriptsTitle">脚本执行</h2><span id="script-badge" class="badge" data-state="off" data-i18n="optScriptsBadgeOff">未开启</span></div><p class="hint" data-i18n="optScriptsIntro">普通工具做不到时运行 JavaScript，每次须你批准。</p><p id="script-status" class="script-status" role="status" aria-live="polite"></p></div>
<div class="script-actions"><button id="script-grant" type="button" data-i18n="optScriptsGrant">允许</button><button id="script-details" type="button" hidden data-i18n="optScriptsDetails">打开扩展详情</button><button id="script-revoke" class="link" type="button" hidden data-i18n="optScriptsRevoke">关闭</button></div></section>
<details id="more" class="card more"><summary data-i18n="optMore">更多设置</summary>
<div class="group"><label for="language-choice" class="group-title" data-i18n="optLanguage">回复语言</label><div class="field-row"><div class="field"><select id="language-choice"><option value="browser" selected>跟随浏览器</option><option value="简体中文">简体中文</option><option value="English">English</option><option value="繁體中文">繁體中文</option><option value="日本語">日本語</option><option value="other" data-i18n="optLanguageOther">其他…</option></select></div><div class="field"><input id="language" required maxlength="60" value="简体中文" hidden aria-label="自定义回复语言" data-i18n-aria-label="optLanguageCustom" placeholder="例如 Deutsch" data-i18n-placeholder="optLanguagePlaceholder"></div></div></div>
<div class="group"><h3 class="group-title" data-i18n="optBudget">执行预算</h3><div class="field-row">
<div class="field"><label for="max-steps" data-i18n="optMaxSteps">每次任务最多轮数（0 = 不限）</label><input id="max-steps" type="number" min="0" step="1" value="100" required></div>
<div class="field"><label for="input-chars" data-i18n="optInputChars">单条消息字符上限</label><input id="input-chars" type="number" min="100" max="10000" step="1" value="2000" required></div>
</div></div>
<div class="group"><h3 class="group-title" data-i18n="optAdvanced">高级</h3><div class="field-row">
<div class="field"><label for="reasoningEffort" data-i18n="optReasoning">思考强度</label><select id="reasoningEffort"><option value="low" data-i18n="optReasoningLow">低</option><option value="medium" selected data-i18n="optReasoningMedium">中（默认）</option><option value="high" data-i18n="optReasoningHigh">高</option><option value="default" data-i18n="optReasoningDefault">服务默认（不发送思考参数）</option></select></div>
<div class="field"><label for="toolMode" data-i18n="optToolMode">工具调用协议</label><select id="toolMode"><option value="auto" selected data-i18n="optToolModeAuto">自动（默认）</option><option value="native" data-i18n="optToolModeNative">仅原生工具调用</option><option value="json" data-i18n="optToolModeJson">仅 JSON 文本</option></select></div>
<div class="field"><label for="context-tokens" data-i18n="optContextTokens">上下文窗口（token）</label><input id="context-tokens" type="number" min="8192" max="262144" step="1" value="100000" required></div>
<div class="field"><label for="compression-threshold" data-i18n="optCompression">压缩阈值（%）</label><input id="compression-threshold" type="number" min="50" max="95" step="1" value="80" required></div>
</div></div>
<div class="save-row"><button id="save-more" class="primary" type="submit" data-i18n="optSave">保存</button><p id="status-more" role="status" aria-live="polite" hidden></p></div>
<div class="group inline-group"><div><h3 class="group-title" data-i18n="optPermissions">网站访问</h3><p id="grant-all-status" class="hint" role="status"></p></div><button id="grant-all" type="button" data-i18n="optGrantAll">授权所有网站</button></div>
<div class="group inline-group"><div class="image-info"><img id="welcome-image-preview" src="icons/welcome-assistant.webp" width="48" height="48" alt="当前侧栏主图预览" data-i18n-alt="optImagePreview"><div><h3 class="group-title" data-i18n="optImageTitle">侧栏主图</h3><p id="welcome-image-status" class="hint" role="status" aria-live="polite"></p></div></div><input id="welcome-image-file" type="file" accept="image/png,image/jpeg,image/webp" disabled hidden><div class="actions"><button id="welcome-image-pick" type="button" disabled data-i18n="optImageChoose">选择图片</button><button id="welcome-image-reset" type="button" disabled data-i18n="optImageReset">恢复默认</button></div></div>
</details>
</form>
<details id="management" class="card more"><summary data-i18n="optManageMemory">管理记忆</summary>
<p class="hint" data-i18n="optManagementHint">修改或清空记忆会暂停相关任务，回侧栏继续即可。</p>
<label for="managed-tab" data-i18n="optManagedTab">目标网页</label><div class="tab-row"><select id="managed-tab"></select><button id="tabs-refresh" type="button" data-i18n="optTabsRefresh">刷新网页列表</button></div><p id="management-status" role="status"></p>
<details id="site-memory-panel"><summary data-i18n="optSiteMemory">网站长期记忆</summary><p id="site-memory-status" role="status"></p><div id="site-memories"></div>
<form id="site-memory-form"><label for="site-memory-id" data-i18n="optNoteName">笔记名称</label><input id="site-memory-id" maxlength="60" pattern="[a-zA-Z0-9_-]{1,60}" required placeholder="例如 preferred_workflow" data-i18n-placeholder="optSiteNotePlaceholder"><label for="site-memory-text" data-i18n="optNoteText">内容</label><textarea id="site-memory-text" maxlength="2000" required></textarea><button id="site-memory-save" type="submit" data-i18n="optSaveNote">保存笔记</button></form><button id="site-memory-refresh" type="button" data-i18n="optRefreshLongMemory">刷新长期记忆</button><button id="site-memory-clear" type="button" data-i18n="optSiteMemoryClear">清空本站长期记忆</button><button id="site-memory-export" type="button" data-i18n="optSiteMemoryExport">导出本站记忆</button></details>
<details id="global-memory-panel"><summary data-i18n="optGlobalMemory">全局长期记忆</summary><p id="global-memory-status" role="status"></p><div id="global-memories"></div>
<form id="global-memory-form"><label for="global-memory-id" data-i18n="optNoteName">笔记名称</label><input id="global-memory-id" maxlength="60" pattern="[a-zA-Z0-9_-]{1,60}" required placeholder="例如 output_preference" data-i18n-placeholder="optGlobalNotePlaceholder"><label for="global-memory-text" data-i18n="optNoteText">内容</label><textarea id="global-memory-text" maxlength="2000" required></textarea><button id="global-memory-save" type="submit" data-i18n="optSaveNote">保存笔记</button></form><button id="global-memory-refresh" type="button" data-i18n="optRefreshLongMemory">刷新长期记忆</button><button id="global-memory-clear" type="button" data-i18n="optGlobalMemoryClear">清空全局长期记忆</button><button id="global-memory-export" type="button" data-i18n="optGlobalMemoryExport">导出全局记忆</button></details>
<details id="skill-panel"><summary data-i18n="optSkills">技能</summary><p class="hint" data-i18n="optSkillsHint">任务复盘自动保存的可复用做法，所有网站共用，执行时按需读取；可删除。</p><p id="skill-status" role="status"></p><div id="skills"></div><button id="skill-clear" type="button" data-i18n="optSkillClear">清空全部技能</button></details>
</details>
</main></body></html>
